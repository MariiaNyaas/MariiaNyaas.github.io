name: Nordic Financial Resilience Monitor — daily data refresh
on:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'nordic-systemic-risk-monitor/refresh.py'
      - '.github/workflows/nordic-risk-monitor.yml'
permissions:
  contents: write
concurrency:
  group: nordic-risk-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh open-source country indicators
        run: python nordic-systemic-risk-monitor/refresh.py
      - name: Commit source-vintage update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nordic-systemic-risk-monitor/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily Nordic monitor: update source observations and provenance"
            git push
          fi
